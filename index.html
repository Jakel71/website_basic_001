<!DOCTYPE html>
<html>
  <head>
    <title>React_Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!--library -->
    <script src="js/react-basics.js"></script>
    <!-- external library -->
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <!-- React Libraries -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel library -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
        // Like objekt
      function ChatInput() { 
        return(
            <>
                <input
                    placeholder="Type a message..."
                    size="30"
                />
                <button>Send</button>
            </>
        );
      }

      function ChatMessage({message, sender}) {
            //const message = props.message;
            //const sender = props.sender;
            // const {message, sender} = props;
            // if(sender === 'robot') {
            //     return(
            //         <div>
            //             <img src="img/robot.png" width="50" />
            //             {message}
            //         </div>
            //     );
            // }

            return(
                <div>
                    {sender === 'robot' && (
                        <img src="img/robot.png" width="50" />
                    )}
                    {message}
                    {sender === 'user' && (
                        <img src="img/user.png" width="50" />
                    )}
                </div>
            );
        }

      function App() {
        return(
            <>
                <ChatInput />

                <ChatMessage
                    message="Hello chatbot"
                    sender="user"
                />
                <ChatMessage 
                    message="Hello! How can I help you?" 
                    sender="robot"
                />
                <ChatMessage 
                    message="can you get me todays date?" 
                    sender="user"
                />
                <ChatMessage 
                    message="Today is May 3rd, 2026" 
                    sender="robot"
                />
            </>
        );
     }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
